# Builda a imagem no GitHub (nunca na VPS, que tem pouca RAM e é compartilhada com outros apps)
# e publica no GHCR. A VPS só faz `docker compose pull && up -d`.
name: build

on:
  push:
    branches: [main, claude/kind-knuth-ryeca4]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gilbertomaiarj1984/agendaboa:latest
            ghcr.io/gilbertomaiarj1984/agendaboa:${{ github.sha }}
