# Builda a imagem no GitHub (nunca na VPS, que tem pouca RAM e é compartilhada com outros apps)
# e publica no GHCR só a partir da main. Em PR apenas valida o build, sem publicar.
# A VPS só faz `docker compose pull && up -d`.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/gilbertomaiarj1984/agendaboa:latest
            ghcr.io/gilbertomaiarj1984/agendaboa:${{ github.sha }}

  # Deploy automático: depois do build verde na main, a VPS baixa a imagem nova e recria só o container
  # do AgendaBoa (`docker compose pull && up -d`, na pasta do app). Fica desligado (sem erro) enquanto os
  # segredos abaixo não existirem. Passo a passo em infra/README.md ("Deploy automático").
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-agendaboa
      cancel-in-progress: false # nunca interrompe um deploy em andamento; o próximo espera a vez
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/agendaboa' }}
      APP_URL: ${{ vars.APP_URL || 'https://agenda.143-95-214-240.sslip.io' }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          missing=""
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy automático desligado::Faltam os segredos:$missing (veja infra/README.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pasta vai para um comando remoto: aceita só caminho simples.
          if ! printf '%s' "$VPS_APP_DIR" | grep -Eq '^/[A-Za-z0-9_./-]+$'; then
            echo "::error::VPS_APP_DIR inválido: $VPS_APP_DIR"; exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Preparar SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar o AgendaBoa na VPS
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          # Se a chave tiver `command=` no authorized_keys (recomendado), a VPS ignora este texto e roda o
          # comando fixo; sem restrição, este é o comando executado. Mexe só no projeto compose do AgendaBoa.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd $VPS_APP_DIR && docker compose pull && docker compose up -d"

      - name: Confirmar que a versão nova está no ar
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sha7="${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            if curl -fsS -m 10 "$APP_URL/login" 2>/dev/null | grep -q "$sha7"; then
              echo "No ar: $APP_URL mostra o build $sha7"; exit 0
            fi
            echo "Aguardando o build $sha7 aparecer em $APP_URL ($i/30)..."; sleep 6
          done
          echo "::error::O app não mostrou o build $sha7 em 3 minutos. Veja os logs: docker compose logs --tail 50 app"
          exit 1
